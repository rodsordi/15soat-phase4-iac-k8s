name: "Kubernetes EKS IaC CI/CD"

on:
  push:
    branches:
      - master
      - feature/phase4
  pull_request:
    branches:
      - master
      - feature/phase4

  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to execute'
        required: true
        default: 'apply'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform EKS Automation"
    runs-on: ubuntu-latest

    env:
      AWS_REGION: "us-east-1"
      TF_VAR_newrelic_license_key: ${{ secrets.NEWRELIC_LICENSE_KEY || 'NRJS-DUMMY-LICENSE-KEY' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (AWS Academy Support)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Ensure Terraform State Storage Exists
        run: |
          BUCKET="fiap-phase4-terraform-state"
          TABLE="fiap-phase4-tf-lock"

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET does not exist. Creating via pipeline..."
            aws s3 mb "s3://$BUCKET" --region "${{ env.AWS_REGION }}"
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
          else
            echo "Bucket $BUCKET already exists."
          fi

          if ! aws dynamodb describe-table --table-name "$TABLE" --region "${{ env.AWS_REGION }}" 2>/dev/null; then
            echo "DynamoDB table $TABLE does not exist. Creating via pipeline..."
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${{ env.AWS_REGION }}"
          else
            echo "DynamoDB table $TABLE already exists."
          fi

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
        run: terraform plan -no-color

      - name: Terraform Apply
        id: apply
        if: (github.ref == 'refs/heads/master' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -auto-approve -no-color

      - name: Terraform Destroy
        id: destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve -no-color
